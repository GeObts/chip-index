[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Same compiler settings as chipworks-contracts.
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./test/fork" }]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "base-std/=lib/base-std/src/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512

[rpc_endpoints]
base = "${BASE_RPC_URL}"

[etherscan]
base = { key = "${BASESCAN_API_KEY}", chain = 8453 }

[lint]
lint_on_build = false

[invariant]
runs = 64
depth = 100

# FOUNDRY_PROFILE=deep forge test  -> full-strength fuzz/invariant run (~8 min)
[profile.deep.invariant]
runs = 512
depth = 500

[profile.deep.fuzz]
runs = 4096
